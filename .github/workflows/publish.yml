name: Publish Package

# Triggered when a GitHub Release is published, or manually via workflow_dispatch.
# Create the release via: gh release create vX.Y.Z --target main
# The tag MUST match the version in package.json.
on:
  release:
    types: [published]
  workflow_dispatch:

# Permissions needed for npm OIDC provenance and GitHub Packages publishing.
permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Gate: full test matrix must pass before publish is allowed.
  # ──────────────────────────────────────────────────────────────────
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint (syntax check all source files)
        run: pnpm run lint

      - name: Run tests
        run: pnpm test

      - name: Audit for high/critical vulnerabilities
        run: pnpm audit --audit-level=high

      - name: Dry-run pack (verify publishable artefact)
        run: npm pack --dry-run

  # ──────────────────────────────────────────────────────────────────
  # Publish to npm Registry (npmjs.com) with provenance attestation.
  # ──────────────────────────────────────────────────────────────────
  publish-npm:
    name: Publish to npmjs.com
    needs: test
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node 22 (LTS) with npm registry auth
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify version matches release tag (if release trigger)
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          echo "package.json version : $PKG_VERSION"
          echo "Release tag          : $RELEASE_TAG"
          if [ "$PKG_VERSION" != "$RELEASE_TAG" ]; then
            echo "::error::Version mismatch — package.json ($PKG_VERSION) != release tag ($RELEASE_TAG)"
            exit 1
          fi

      - name: Publish to npm
        run: pnpm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ──────────────────────────────────────────────────────────────────
  # Publish to GitHub Packages (npm.pkg.github.com)
  # ──────────────────────────────────────────────────────────────────
  publish-gpr:
    name: Publish to GitHub Packages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node 22 with GitHub Packages registry auth
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://npm.pkg.github.com
          scope: '@bluecarbons'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # GitHub Packages strictly requires the package name in package.json to
      # be prefixed with @<owner>/ (e.g. @bluecarbons/agentic-rss-parser).
      - name: Set scoped package name for GitHub Packages
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (!pkg.name.startsWith('@')) {
              pkg.name = '@bluecarbons/' + pkg.name;
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            }
          "

      - name: Publish to GitHub Packages
        run: npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
