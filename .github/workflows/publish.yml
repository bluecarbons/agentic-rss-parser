name: Publish Package

# Triggers:
# 1. On pushing a version tag (e.g. git push origin v1.7.0)
# 2. On publishing a GitHub Release
# 3. Manually via GitHub Actions UI (workflow_dispatch)
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Publish target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - npm
          - github-packages

# Permissions needed for npm OIDC provenance and GitHub Packages publishing.
permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Gate: full test matrix must pass before publish is allowed.
  # ──────────────────────────────────────────────────────────────────
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint (syntax check all source files)
        run: pnpm run lint

      - name: Run tests
        run: pnpm test

      - name: Audit for high/critical vulnerabilities
        run: pnpm audit --audit-level=high

      - name: Dry-run pack (verify publishable artefact)
        run: npm pack --dry-run

  # ──────────────────────────────────────────────────────────────────
  # Publish to npm Registry (npmjs.com)
  # ──────────────────────────────────────────────────────────────────
  publish-npm:
    name: Publish to npmjs.com
    needs: test
    if: |
      always() &&
      needs.test.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'npm')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node 22 (LTS) with npm registry auth
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Verify tag matches version if triggered by tag or release
      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          REF_TAG="${{ github.ref_name || github.event.release.tag_name }}"
          echo "package.json version : $PKG_VERSION"
          echo "Release/Git tag      : $REF_TAG"
          if [ "$PKG_VERSION" != "$REF_TAG" ]; then
            echo "::error::Version mismatch — package.json ($PKG_VERSION) != tag ($REF_TAG)"
            exit 1
          fi

      - name: Publish to npm
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
            pnpm publish --access public --no-git-checks
          else
            pnpm publish --access public --provenance --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ──────────────────────────────────────────────────────────────────
  # Publish to GitHub Packages (npm.pkg.github.com)
  # ──────────────────────────────────────────────────────────────────
  publish-gpr:
    name: Publish to GitHub Packages
    needs: test
    if: |
      always() &&
      needs.test.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'github-packages')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node 22 with GitHub Packages registry auth
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://npm.pkg.github.com
          scope: '@bluecarbons'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # GitHub Packages strictly requires the package name in package.json to
      # be prefixed with @<owner>/ (e.g. @bluecarbons/agentic-rss-parser).
      - name: Set scoped package name for GitHub Packages
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (!pkg.name.startsWith('@')) {
              pkg.name = '@bluecarbons/' + pkg.name;
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            }
          "

      - name: Publish to GitHub Packages
        run: npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
